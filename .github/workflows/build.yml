name: Build Kernel (Droidspaces)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'pipa'
        type: choice
        options:
          - pipa
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Droidspaces patches (this repo)
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        path: patches

    - name: Checkout full kernel source (base repo)
      uses: actions/checkout@v7
      with:
        repository: 12begin/android_kernel_xiaomi_sm8250
        ref: android16-aptusitu-new
        fetch-depth: 1
        path: kernel

    - name: Apply Droidspaces patches
      run: |
        cd kernel
        cp -a ../patches/build_kernel.sh .
        cp -a ../patches/arch/arm64/configs/pipa_defconfig arch/arm64/configs/pipa_defconfig
        cp -a ../patches/drivers/bus/mhi/core/mhi_init.c drivers/bus/mhi/core/mhi_init.c
        cp -a ../patches/drivers/input/keyboard/nanosic_driver_v2/nano_macro.h drivers/input/keyboard/nanosic_driver_v2/nano_macro.h
        cp -a ../patches/kernel/cgroup/cgroup.c kernel/cgroup/cgroup.c

        # ---- sanity checks: fail early if patches did not apply ----
        grep -q '^CONFIG_USER_NS=y' arch/arm64/configs/pipa_defconfig || { echo "FAIL: CONFIG_USER_NS missing"; exit 1; }
        grep -q '^CONFIG_PID_NS=y' arch/arm64/configs/pipa_defconfig || { echo "FAIL: CONFIG_PID_NS missing"; exit 1; }
        grep -q -- '-e MILLET \\' build_kernel.sh || { echo "FAIL: MILLET not restored"; exit 1; }
        if grep -q 'MILLET_CGROUP\|BINDER_PRIO' build_kernel.sh; then
          echo "FAIL: MILLET_* split / BINDER_PRIO still present"; exit 1
        fi
        grep -q 'Guard against NULL' drivers/bus/mhi/core/mhi_init.c || { echo "FAIL: mhi fix missing"; exit 1; }
        grep -q 'CGRP_ROOT_NOPREFIX' kernel/cgroup/cgroup.c || { echo "FAIL: cgroup fix missing"; exit 1; }
        grep -q 'rawdata_show' drivers/input/keyboard/nanosic_driver_v2/nano_macro.h || { echo "FAIL: nano_macro.h missing"; exit 1; }
        grep -q '^CONFIG_DEVPTS_MULTIPLE_INSTANCES=y' arch/arm64/configs/pipa_defconfig || { echo "FAIL: CONFIG_DEVPTS_MULTIPLE_INSTANCES missing"; exit 1; }
        grep -q '^CONFIG_CGROUP_NS=y' arch/arm64/configs/pipa_defconfig || { echo "FAIL: CONFIG_CGROUP_NS missing"; exit 1; }
        grep -q '^CONFIG_CHECKPOINT_RESTORE=y' arch/arm64/configs/pipa_defconfig || { echo "FAIL: CONFIG_CHECKPOINT_RESTORE missing"; exit 1; }
        echo "[+] All patches verified OK"

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Run Build Script
      working-directory: kernel
      run: |
        chmod +x build_kernel.sh

        ARGS="${{ github.event.inputs.device }}"

        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi

        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: kernel/APTKernel_*.zip
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: kernel-${{ github.event.inputs.device }}-${{ github.run_id }}
        name: "Droidspaces Kernel ${{ github.event.inputs.device }} - Build ${{ github.run_id }}"
        body: |
          Droidspaces 内核自动构建
          - **设备**: ${{ github.event.inputs.device }}
          - **KernelSU**: ${{ github.event.inputs.ksu }}
          - **目标系统**: ${{ github.event.inputs.target_os }}
        files: kernel/APTKernel_*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
